<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Recipedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FFF8F0; }
    </style>
</head>
<body class="text-gray-700 bg-white">
    <div class="min-h-screen flex flex-col justify-center items-center">
        <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md mt-20">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Feedback</h2>
            <form id="feedbackForm">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 mb-1">Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-3 py-2 rounded border border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required class="w-full px-3 py-2 rounded border border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>
                <div class="mb-4">
                    <label for="comment" class="block text-gray-700 mb-1">Comment</label>
                    <textarea id="comment" name="comment" rows="4" required class="w-full px-3 py-2 rounded border border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-400"></textarea>
                </div>
                <button type="submit" class="w-full bg-red-500 text-white py-2 rounded-full font-semibold hover:bg-red-600 transition">Submit</button>
            </form>
            <div id="thankYouMessage" class="hidden mt-6 text-green-600 text-center font-semibold">
                Thank you for your feedback!
            </div>
        </div>
        <a href="recipe.html" class="mt-8 text-red-500 hover:underline">Back to Home</a>
    </div>
    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('feedbackForm').classList.add('hidden');
            document.getElementById('thankYouMessage').classList.remove('hidden');
        });
    </script>
</body>
</html>
